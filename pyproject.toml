[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fox-guard"
version = "0.1.0"
description = "FOX-Guard: guardrails 3 trạm (input/context/output) phát hiện prompt injection và che PII cho ứng dụng LLM"
readme = "README.md"
requires-python = ">=3.11"
# Phụ thuộc chung tối thiểu để import được package và chạy CLI.
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "regex>=2024.0",
  "typer>=0.12",
]

[project.optional-dependencies]
# Sidecar HTTP + client judge (B1, B7, B4.3).
core = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "idna>=3.7",
]
# Classifier (B4). torch KHÔNG ghim bản CUDA/CPU: env DL đã có sẵn torch.
ml = [
  "transformers>=4.45",
  "torch>=2.3",
  "tokenizers>=0.20",
  "sentencepiece>=0.2",
  "protobuf>=5",
  "onnxruntime>=1.18",
]
# PII (B5). NER (underthesea / GLiNER / OpenMed) chọn sau spike B5.1, chưa khai báo ở đây.
pii = [
  "presidio-analyzer>=2.2.355",
  "presidio-anonymizer>=2.2.355",
  "phonenumbers>=8.13",
]
# Dashboard (B10).
dash = [
  "streamlit>=1.38",
  "pandas>=2.2",
  "plotly>=5.24",
]
dev = [
  "pytest>=8.0",
  "pytest-benchmark>=4.0",
  "ruff>=0.6",
]

[project.scripts]
fox-guard = "fox_guard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fox_guard = ["data/*", "detectors/rules/packs/*.yaml", "policy/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model: cần tải model Hugging Face (bỏ qua trên CI bằng -m 'not model')",
  "slow: chạy lâu (benchmark độ trễ)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
