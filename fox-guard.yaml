# Cấu hình mặc định FOX-Guard. Các gói B2–B7 điền dần; mỗi khoá mới phải có chú thích một dòng.
config_version: "0.1.0"

normalize:            # B2
  max_chars: 20000
  decode_max_depth: 2

classifier:           # Lớp 5: ngưỡng chốt trên dev (eval/calibrate.py), không chỉnh theo test
  primary: meta-llama/Llama-Prompt-Guard-2-86M      # chưa dùng: chờ bạn chấp nhận license trên HF
  secondary: protectai/deberta-v3-base-prompt-injection-v2
  enabled: false      # tắt mặc định: deberta yếu trên tiếng Việt và chậm trên CPU (eval/reports/lop5-deberta_2026-11-07.md)
  use: secondary
  model_dir: models   # trọng số tải sẵn, không tải lúc chạy
  theta_low: 0.999324   # deberta, FPR dev ≤ 10% (eval/reports/thresholds_deberta.json)
  theta_high: 0.999991  # deberta, FPR dev ≤ 2%

pii:                  # B5: giả danh hoá theo phiên, bản đồ chỉ trong bộ nhớ
  enabled: true
  vault_ttl_minutes: 60

links:                # B5.4: host của shop; link/ảnh ngoài danh sách bị gỡ ở trạm output
  allowlist: [shop.example]

policy:               # B6.2: câu mẫu thay cho nội dung bị chặn (mặc định trong config.py)
  context_hidden_text: "[nội dung này bị ẩn do nghi chứa chỉ dẫn độc hại]"

audit:                # B6.5: SQLite chỉ nhận text đã che; salt băm user_ref lấy từ biến môi trường
  enabled: true
  sqlite_path: var/fox_guard.sqlite
  salt_env: FOX_AUDIT_SALT
